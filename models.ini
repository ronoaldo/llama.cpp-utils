; =================================================================
; Global Defaults (100k context, q8_0 KV cache, desktop safe)
; =================================================================
[*]
ctx-size = 102400
ubatch-size = 1024
batch-size = 1024
cache-type-k = q8_0
cache-type-v = q8_0
reasoning-budget = 4096
n-predict = 8192

; =================================================================
; Google Models
; - V cache mantido em f16 (Gemma e sensivel a quantizacao do V cache)
; - Perfis performance usam ngram-mod (GGUF oficial nao possui MTP)
; =================================================================

; --- Gemma 4 26B A4B (MoE) ---
; Default: 16 experts na CPU (n-cpu-moe) para caber em 16GB VRAM com folga desktop
[google/gemma-4-26B-A4B]
hf = google/gemma-4-26B-A4B-it-qat-q4_0-gguf
alias = google-gemma-4-26b-a4b
ubatch-size = 256
batch-size = 256
flash-attn = on
cache-type-v = f16
temp = 1.0
top-p = 0.95
top-k = 64
n-gpu-layers = 99
n-cpu-moe = 16
threads = 8

; Performance: auto-fit com margem de 2GB de VRAM e aceleracao n-gram
[google/gemma-4-26B-A4B-performance]
hf = google/gemma-4-26B-A4B-it-qat-q4_0-gguf
alias = google-gemma-4-26b-a4b-perf
flash-attn = on
cache-type-v = f16
temp = 1.0
top-p = 0.95
top-k = 64
fit-target = 2048
threads = 12
spec-type = ngram-mod
spec-draft-n-max = 3

; --- Gemma 4 12B (Dense) ---
