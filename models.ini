; =================================================================
; Ornith 1.5 Models (Ornith AI)
; - Raciocinio nativo (<think>) com alta performance em SWE-bench e Terminal-Bench
; - Parametros de amostragem padronizados para coding (temp=0.6, top-p=0.95, top-k=20)
; - Herda ctx-size = 100k e KV cache q8_0 do global [*]
; =================================================================

; --- Ornith 1.5 35B A3B (MoE) ---
; Default (Desktop & OBS Safe): 32 camadas MoE em CPU, ubatch 256 e 8 threads (VRAM ~9.9GB a 100k)
[ornith/ornith-1.5-35B-A3B]
hf = ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q4_K_M
alias = ornith-1.5-35b
ubatch-size = 256
batch-size = 256
flash-attn = on
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.00
n-gpu-layers = 99
n-cpu-moe = 32
threads = 8

; Performance: Mais experts na GPU (24 na CPU), 12 threads e aceleracao especulativa n-gram
