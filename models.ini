hf = ornith-ai/Ornith-1.5-35B-A3B-GGUF:Q4_K_M
alias = ornith-1.5-35b-perf
flash-attn = on
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.00
n-gpu-layers = 99
n-cpu-moe = 24
threads = 12
spec-type = ngram-mod
spec-draft-n-max = 3

