[*]
; Adjust a larger context window for coding agents
ctx-size = 65536
; Balance prompt-processing speed vs compute-buffer VRAM usage
ubatch-size = 256
batch-size = 1024
; Save some VRAM to Desktop
cache-type-k = q8_0
cache-type-v = q8_0

; =================================================================
; Profile conventions
; - Default profiles: leave VRAM and CPU headroom so the desktop and
;   streaming software (e.g. OBS) keep running smoothly.
; - "-performance" profiles: use most of the GPU; the desktop stays
;   usable but with less headroom.
; Both models are MoE: keep every layer on GPU (n-gpu-layers = 99)
; and push part of the experts to CPU (n-cpu-moe) to fit in VRAM.
; Tuning: lower n-cpu-moe while VRAM allows, then validate speed
; with ./llama-ping. Watch usage with:
;   cat /sys/class/drm/card*/device/mem_info_vram_used
; =================================================================

; --- Gemma 4 26B A4B (UD-Q4_K_XL is ~15GB on disk) ---

; Default: live/OBS-safe
[gemma-4-26B]
hf = unsloth/gemma-4-26B-A4B-it-qat-GGUF:UD-Q4_K_XL
alias = gemma-4-26b
; enable flash attention
flash-attn = on
; unsloth recomendations for coding
temp = 1.0
top-p = 0.95
top-k = 64
; all layers on GPU, ~1/3 of the experts on CPU
n-gpu-layers = 99
n-cpu-moe = 16
; leave cores free for video encoding and the desktop
threads = 8

; Performance: uses most of the GPU
[gemma-4-26B-performance]
hf = unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_XL
alias = gemma-4-26b-perf
; enable flash attention
flash-attn = on
; unsloth recomendations for coding
temp = 1.0
top-p = 0.95
top-k = 64
; let --fit auto-tune GPU offload, keeping a 2GiB VRAM margin
fit-target = 2048
; all physical cores for the CPU-side experts
threads = 12
; speed things up with MTP
spec-type = draft-mtp
spec-draft-n-max = 2

; --- Qwen 3.6 35B A3B (UD-Q4_K_XL is ~20GB on disk, needs n-cpu-moe) ---

; Default: live/OBS-safe
[qwen-3.6-35B]
hf = unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_XL
alias = qwen-3.6-35b
; enable flash attention
flash-attn = on
; unsloth recomendations for coding
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.00
; all layers on GPU, ~half of the experts on CPU
n-gpu-layers = 99
n-cpu-moe = 32
; leave cores free for video encoding and the desktop
threads = 8
; speed things up with MTP
spec-type = draft-mtp
spec-draft-n-max = 2

; Performance: uses most of the GPU
[qwen-3.6-35B-performance]
hf = unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q4_K_XL
alias = qwen-3.6-35b-perf
; enable flash attention
flash-attn = on
; unsloth recomendations for coding
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.00
; all layers on GPU, experts on CPU beyond what VRAM fits
; (manual n-cpu-moe beats --fit here: fit offloads whole layers,
;  which is slower for MoE + Gated Delta Net models)
n-gpu-layers = 99
n-cpu-moe = 24
; all physical cores for the CPU-side experts
threads = 12
; speed things up with MTP
spec-type = draft-mtp
spec-draft-n-max = 2
